{%- comment -%}
  head_custom.html — Inyectado automáticamente por just-the-docs en el <head>
  de cada página. Lo usamos para cargar MathJax v3.

  Migramos a \(...\) y \[...\] como delimitadores porque $...$ y $$...$$
  generan falsos positivos con prosa en español (ej. "cuesta $500").
{%- endcomment -%}

<script>
  window.MathJax = {
    tex: {
      inlineMath:  [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']],
      processEscapes: true,
      processEnvironments: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>
<script
  id="MathJax-script"
  async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>
